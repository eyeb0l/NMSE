# --------------------------------------------------------------
# NMSE PR Validation Workflow
# Builds and tests the Avalonia frontend on Windows and Linux, then packages it
# on Apple Silicon and Intel macOS. No release is created.
#
# Windows validation uses fast managed builds. The macOS jobs additionally perform
# managed self-contained publishes so the actual app bundles can be signed, validated,
# launched, and uploaded for review; PR validation never enables Native AOT.
#
# All actions are pinned to immutable commit SHAs to mitigate
# supply-chain attacks.  When upgrading, update both the SHA
# and the version comment.
# --------------------------------------------------------------

name: Validate PR

env:
  PROJECT_FILE: NMSE.csproj
  AVALONIA_PROJECT_FILE: NMSE.csproj
  AVALONIA_TEST_PROJECT_FILE: NMSE.Avalonia.Tests/NMSE.Avalonia.Tests.csproj
  MAC_UPDATER_TEST_PROJECT_FILE: NMSE.MacUpdater.Tests/NMSE.MacUpdater.Tests.csproj
  TEST_PROJECT_FILE: NMSE.Tests/NMSE.Tests.csproj
  EXTRACTOR_TEST_PROJECT_FILE: NMSE.Extractor.Tests/NMSE.Extractor.Tests.csproj
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release
  AVALONIA_TELEMETRY_OPTOUT: "1"

on:
  # -- Un/comment the pull_request block below to enable PR validation --
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Root-level project files
      - "NMSE.csproj"
      - "NMSE.slnx"
      - "Directory.Build.props"
      - "Program.cs"
      # Project source folders
      - "Config/**"
      - "Core/**"
      - "Data/**"
      - "IO/**"
      - "Models/**"
      - "UI/**"
      - "UI.Avalonia/**"
      # Temporary for testing
      - ".github/**"
      - "scripts/macos/**"
      - "docs/dev/macos-*.md"
      # Shared resources consumed by NMSE
      - "Resources/**"
      # Version file (PRs that bump version should also be validated)
      - "version.json"
      # Test project changes should trigger PR builds so test regressions
      # are caught before merge
      - "NMSE.Tests/**"
      - "NMSE.Avalonia.Tests/**"
      - "NMSE.MacUpdater.Tests/**"
      # Never trigger on the extractor projects
      - "!NMSE.Extractor/**"
      - "!NMSE.Extractor.Tests/**"
      # Ignore the static site project
      - "!NMSE.Site/**"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  validate-windows:
    name: Windows frontends and tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Restore Avalonia headless tests
        run: dotnet restore ${{ env.AVALONIA_TEST_PROJECT_FILE }}

      - name: Run Avalonia headless tests
        run: dotnet run --project ${{ env.AVALONIA_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -- -noColor -noLogo

      - name: Restore macOS updater characterization tests
        run: dotnet restore ${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}

      - name: Run macOS updater characterization tests
        run: dotnet test ${{ env.MAC_UPDATER_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_FILE }}

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

      - name: Restore extractor tests
        run: dotnet restore ${{ env.EXTRACTOR_TEST_PROJECT_FILE }}

      - name: Run Windows-only extractor tests
        run: dotnet test ${{ env.EXTRACTOR_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

  validate-linux:
    name: Linux native frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build native frontend
        run: |
          dotnet restore "${{ env.PROJECT_FILE }}" -r linux-x64
          dotnet build "${{ env.PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Restore and run headless tests
        run: |
          dotnet restore "${{ env.AVALONIA_TEST_PROJECT_FILE }}"
          dotnet run --project "${{ env.AVALONIA_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore -- -noColor -noLogo

      - name: Publish self-contained Linux app
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PublishAot=false \
            -o "$RUNNER_TEMP/publish-linux-x64"
          test -x "$RUNNER_TEMP/publish-linux-x64/NMSE"

  validate-macos:
    name: macOS ${{ matrix.arch }} native package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build Avalonia frontend
        run: |
          dotnet restore "${{ env.AVALONIA_PROJECT_FILE }}" -r "${{ matrix.rid }}"
          dotnet build "${{ env.AVALONIA_PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Restore and run core tests
        run: |
          dotnet restore "${{ env.TEST_PROJECT_FILE }}"
          dotnet test "${{ env.TEST_PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore --verbosity normal

      - name: Restore and run Avalonia headless tests
        run: |
          dotnet restore "${{ env.AVALONIA_TEST_PROJECT_FILE }}"
          dotnet run --project "${{ env.AVALONIA_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore -- -noColor -noLogo

      - name: Restore and run macOS updater characterization tests
        run: |
          dotnet restore "${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}"
          dotnet test "${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore --verbosity normal

      - name: Publish self-contained app
        run: |
          dotnet publish "${{ env.AVALONIA_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --no-restore \
            -p:PublishAot=false \
            -o "$RUNNER_TEMP/publish-${{ matrix.rid }}"

      - name: Build, ad-hoc sign, and validate native artifacts
        run: |
          chmod +x scripts/macos/build-dmg.sh scripts/macos/validate-bundle.sh
          scripts/macos/build-dmg.sh \
            "$RUNNER_TEMP/publish-${{ matrix.rid }}" \
            "${{ matrix.rid }}" \
            "$GITHUB_WORKSPACE/Build/macos"

      - name: Launch packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k "$(find Build/macos -name '*-${{ matrix.arch }}.zip' -print -quit)" "$RUNNER_TEMP/launch"
          APP="$RUNNER_TEMP/launch/NMSE.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$APP/Contents/MacOS/$EXECUTABLE" > "$RUNNER_TEMP/nmse-launch.log" 2>&1 &
          APP_PID=$!
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/nmse-launch.log"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Upload ad-hoc signed PR artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: NMSE-macOS-${{ matrix.arch }}-PR
          path: |
            Build/macos/*-${{ matrix.arch }}.zip
            Build/macos/*-${{ matrix.arch }}.dmg
          if-no-files-found: error
