# PRs use the same build/test/package matrix as releases, without signing secrets.
name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "*.csproj"
      - "NMSE.slnx"
      - "Directory.Build.*"
      - "AvaloniaProgram.cs"
      - "App.axaml*"
      - "Config/**"
      - "Core/**"
      - "Data/**"
      - "IO/**"
      - "Models/**"
      - "UI.Avalonia/**"
      - "Resources/**"
      - "version.json"
      - "NMSE.Tests/**"
      - "NMSE.Avalonia.Tests/**"
      - "NMSE.MacUpdater.Tests/**"
      - "NMSE.Extractor/**"
      - "NMSE.Extractor.Tests/**"
      - ".github/**"
      - "scripts/**"
      - "docs/dev/building.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-platforms.yml
