# Build the same packages as local scripts, then add missing assets to a release.
name: Build NMSE

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Build and test without creating a release"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-platforms.yml
    with:
      sign_macos: true
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'vectorcmdr/NMSE' && (github.event_name != 'workflow_dispatch' || inputs.smoke_only != 'true')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NMSE-*
          merge-multiple: true
          path: Build/artifacts

      - name: Create release or upload missing assets
        shell: bash
        run: |
          version="$(python -c 'import json; v=json.load(open("version.json")); print(".".join(str(v[k]) for k in ("major", "minor", "patch")))')"
          tag="v$version"
          files=(Build/artifacts/NMSE-"$version"-*)
          [[ -f "${files[0]}" ]] || { echo "No release packages found" >&2; exit 1; }
          if existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"; then
            for package in "${files[@]}"; do
              name="$(basename "$package")"
              if ! printf '%s\n' "$existing" | grep -Fxq "$name"; then
                gh release upload "$tag" "$package"
              fi
            done
          else
            notes="$RUNNER_TEMP/release-body.md"
            if [[ -f release-notes.md ]]; then
              cp release-notes.md "$notes"
            else
              : > "$notes"
            fi
            printf '\n\n---\n\nAutomated release **%s** (build #%s) from `%s`\n' \
              "$tag" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" >> "$notes"
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "NMSE $tag" --notes-file "$notes"
          fi
