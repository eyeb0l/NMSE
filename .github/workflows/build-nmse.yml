# --------------------------------------------------------------
# NMSE Release Build Workflow
# Builds, tests, publishes, and creates a GitHub
# Release whenever version.json is updated on the default branch.
#
# Release artifacts are self-contained, so users do not need .NET installed.
# Every desktop payload uses the native Avalonia frontend. Publishing remains
# managed and self-contained until a separate Native AOT parity project lands.
#
# Each release is tagged with a semantic version (e.g. v1.2.3)
# derived from version.json.  The release body is read from
# release-notes.md in the repo root.
#
# Platform builds:
#   - Windows: native self-contained Avalonia ZIP
#   - Linux:   native self-contained Avalonia tarball
#   - macOS:   native self-contained Avalonia ZIP + DMG (arm64 and x64)
#
# The release step is additive: if a matching release already
# exists (e.g. from a previous run), only missing artifacts are
# uploaded - existing files, title, and notes are preserved.
#
# All actions are pinned to immutable commit SHAs to mitigate
# supply-chain attacks.  When upgrading, update both the SHA
# and the version comment.
# --------------------------------------------------------------

name: Build NMSE

env:
  PROJECT_NAME: NMSE
  PROJECT_FILE: NMSE.csproj
  AVALONIA_PROJECT_FILE: NMSE.csproj
  AVALONIA_TEST_PROJECT_FILE: NMSE.Avalonia.Tests/NMSE.Avalonia.Tests.csproj
  MAC_UPDATER_TEST_PROJECT_FILE: NMSE.MacUpdater.Tests/NMSE.MacUpdater.Tests.csproj
  TEST_PROJECT_FILE: NMSE.Tests/NMSE.Tests.csproj
  EXTRACTOR_TEST_PROJECT_FILE: NMSE.Extractor.Tests/NMSE.Extractor.Tests.csproj
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release
  AVALONIA_TELEMETRY_OPTOUT: "1"

# Top-level permissions grant contents:write to all jobs.
# This is required for the release job to create tags and releases
# via the GITHUB_TOKEN.  Without this, repos whose default workflow
# permissions are set to "read" will fail with HTTP 403.
permissions:
  contents: write

on:
  # -- Un/comment the push block below to enable automated releases --
  push:
    paths:
      - "version.json"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Restore Avalonia headless tests
        run: dotnet restore ${{ env.AVALONIA_TEST_PROJECT_FILE }}

      - name: Run Avalonia headless tests
        run: dotnet run --project ${{ env.AVALONIA_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -- -noColor -noLogo

      - name: Restore macOS updater characterization tests
        run: dotnet restore ${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}

      - name: Run macOS updater characterization tests
        run: dotnet test ${{ env.MAC_UPDATER_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_FILE }}

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

      - name: Restore extractor tests
        run: dotnet restore ${{ env.EXTRACTOR_TEST_PROJECT_FILE }}

      - name: Run Windows-only extractor tests
        run: dotnet test ${{ env.EXTRACTOR_TEST_PROJECT_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal

      - name: Publish native self-contained Avalonia app
        if: success()
        run: >-
          dotnet publish ${{ env.PROJECT_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          -p:PublishAot=false
          -o Build/publish/win-x64

      # -- Publish artifacts ----------------------------------

      - name: Create versioned Windows ZIP
        if: success()
        shell: pwsh
        run: |
          $v = Get-Content version.json | ConvertFrom-Json
          $ver = "$($v.major).$($v.minor).$($v.patch)"
          Compress-Archive -Path Build/publish/win-x64/* -DestinationPath "NMSE-${ver}-windows-x64.zip" -Force

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.PROJECT_NAME }}-build
          path: NMSE-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build native Linux frontend
        run: |
          dotnet restore "${{ env.PROJECT_FILE }}" -r linux-x64
          dotnet build "${{ env.PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Restore and run Avalonia headless tests
        run: |
          dotnet restore "${{ env.AVALONIA_TEST_PROJECT_FILE }}"
          dotnet run --project "${{ env.AVALONIA_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore -- -noColor -noLogo

      - name: Publish native self-contained Linux app
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PublishAot=false \
            -o "$RUNNER_TEMP/publish-linux-x64"
          version="$(jq -r '[.major,.minor,.patch] | join(".")' version.json)"
          tar -czf "NMSE-${version}-linux-x64.tar.gz" -C "$RUNNER_TEMP/publish-linux-x64" .

      - name: Upload native Linux artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.PROJECT_NAME }}-linux-x64
          path: NMSE-*-linux-x64.tar.gz
          if-no-files-found: error

  # -- Native macOS Avalonia bundles -----------------------------
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x64
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build Avalonia frontend
        run: |
          dotnet restore "${{ env.AVALONIA_PROJECT_FILE }}" -r "${{ matrix.rid }}"
          dotnet build "${{ env.AVALONIA_PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Restore and run core tests
        run: |
          dotnet restore "${{ env.TEST_PROJECT_FILE }}"
          dotnet test "${{ env.TEST_PROJECT_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore --verbosity normal

      - name: Restore and run Avalonia headless tests
        run: |
          dotnet restore "${{ env.AVALONIA_TEST_PROJECT_FILE }}"
          dotnet run --project "${{ env.AVALONIA_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore -- -noColor -noLogo

      - name: Restore and run macOS updater characterization tests
        run: |
          dotnet restore "${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}"
          dotnet test "${{ env.MAC_UPDATER_TEST_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore --verbosity normal

      - name: Publish self-contained Avalonia app
        run: |
          dotnet publish "${{ env.AVALONIA_PROJECT_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --no-restore \
            -p:PublishAot=false \
            -o "$RUNNER_TEMP/publish-${{ matrix.rid }}"

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGN_IDENTITY" ]]; then
            echo "Developer ID certificate secrets are incomplete" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/nmse-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/nmse-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/nmse-signing.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"

      - name: Configure notarization profile
        if: env.APPLE_ID != ''
        run: |
          if [[ -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" || -z "$MACOS_SIGN_IDENTITY" ]]; then
            echo "Notarization secrets are incomplete" >&2
            exit 1
          fi
          xcrun notarytool store-credentials nmse-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "MACOS_NOTARY_PROFILE=nmse-notary" >> "$GITHUB_ENV"

      - name: Build and validate native artifacts
        run: |
          chmod +x ./scripts/macos/build-dmg.sh
          chmod +x ./scripts/macos/validate-bundle.sh
          scripts/macos/build-dmg.sh \
            "$RUNNER_TEMP/publish-${{ matrix.rid }}" \
            "${{ matrix.rid }}" \
            "$GITHUB_WORKSPACE/Build/macos"

      - name: Launch packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/launch"
          ditto -x -k "$(find Build/macos -name '*-${{ matrix.arch }}.zip' -print -quit)" "$RUNNER_TEMP/launch"
          APP="$RUNNER_TEMP/launch/NMSE.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$APP/Contents/MacOS/$EXECUTABLE" > "$RUNNER_TEMP/nmse-launch.log" 2>&1 &
          APP_PID=$!
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/nmse-launch.log"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Upload native macOS artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.PROJECT_NAME }}-macOS-${{ matrix.arch }}
          path: |
            Build/macos/*-${{ matrix.arch }}.zip
            Build/macos/*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # -- Release ----------------------------------
  release:
    runs-on: windows-latest
    needs: [build-win, build-linux, build-macos]
    if: always() && needs.build-win.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && github.repository == 'vectorcmdr/NMSE'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download WinBuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-build

      - name: Download native Linux build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-linux-x64

      - name: Download native macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.PROJECT_NAME }}-macOS-*
          merge-multiple: true

      - name: Read version from version.json
        id: version
        shell: pwsh
        run: |
          $v = Get-Content version.json | ConvertFrom-Json
          $ver = "$($v.major).$($v.minor).$($v.patch)"
          "VERSION=$ver"     >> $env:GITHUB_OUTPUT
          "TAG=v$ver"        >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver  Tag: v$ver"

      - name: Build release notes
        if: success()
        id: notes
        shell: pwsh
        run: |
          $ver  = "${{ steps.version.outputs.VERSION }}"
          $sha  = "${{ github.sha }}"
          $run  = "${{ github.run_number }}"

          # Start with release-notes.md template (if it exists)
          $body = ""
          if (Test-Path "release-notes.md") {
            $body = (Get-Content "release-notes.md" -Raw).Trim()
          }

          # Append build metadata
          $meta = "`n`n---`n`n*Automated release **v${ver}** (build #${run}) from ``${sha}``*"
          $body = ($body + $meta).Trim()

          # Write to a temp file for gh release --notes-file
          $body | Out-File release-body.md -Encoding utf8
          "NOTES_FILE=release-body.md" >> $env:GITHUB_OUTPUT

      - name: Create versioned release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $ver = "${{ steps.version.outputs.VERSION }}"
          $cfg = "${{ env.BUILD_CONFIGURATION }}"

          # -- Gather all available release files ----------------
          $files = @()
          Get-ChildItem "*.zip"      | ForEach-Object { $files += $_.Name }
          Get-ChildItem "*.tar.gz"   | ForEach-Object { $files += $_.Name }
          Get-ChildItem "*.dmg"      | ForEach-Object { $files += $_.Name }

          Write-Host "Artifacts to release: $($files -join ', ')"

          # -- Create or update the release ----------------------
          # If the release already exists (e.g. from a previous run or
          # a manual re-run), upload only the missing artifacts.
          # Existing files, title, and notes are preserved.
          $existing = gh release view $tag --json assets --jq ".assets[].name" 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — uploading missing artifacts"
            $existingNames = $existing -split "`n" | Where-Object { $_ }

            foreach ($f in $files) {
              if ($existingNames -contains $f) {
                Write-Host "  Skipping $f (already in release)"
              } else {
                Write-Host "  Uploading $f"
                gh release upload $tag $f
              }
            }
          } else {
            Write-Host "Creating new release $tag"
            $allFiles = $files -join '" "'
            gh release create $tag $files `
              --title "NMSE v${ver}" `
              --notes-file "${{ steps.notes.outputs.NOTES_FILE }}"
          }
